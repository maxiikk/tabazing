<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <title data-i18n="ntpTitle">New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body data-testid="ntp">
  <main id="main" class="ntp" data-testid="ntp-main">
    <form id="search-form" class="search" role="search" data-testid="ntp-search-form">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="search" type="search" name="q" data-i18n-placeholder="ntpSearch" data-i18n-aria="ntpSearch" autocomplete="off" spellcheck="false" enterkeyhint="go" data-testid="ntp-search">
    </form>

    <!-- "Most visited": from this browser's history, nothing leaves the device (newtab.js mostVisited). -->
    <section id="top" class="group" aria-labelledby="top-h" hidden data-testid="ntp-top">
      <h2 id="top-h" class="label" data-i18n="ntpMostVisited" data-testid="ntp-top-heading">Most visited</h2>
      <ul id="tiles" class="tiles" data-testid="ntp-tiles"></ul>
    </section>

    <section id="stars" class="group" aria-labelledby="stars-h" hidden data-testid="ntp-stars">
      <h2 id="stars-h" class="label" data-i18n="starred" data-testid="ntp-stars-heading">Starred</h2>
      <ul id="star-list" class="tiles" data-testid="ntp-star-list"></ul>
    </section>

    <p id="status" class="status" role="status" data-testid="ntp-status"></p>
  </main>
  <footer class="foot" data-testid="ntp-foot">
    <p id="hint" class="hint" data-testid="ntp-hint"></p>
  </footer>
  <script type="module" src="newtab.js"></script>
</body>
</html>
