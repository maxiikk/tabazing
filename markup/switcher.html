<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tabazing</title>
  <link rel="stylesheet" href="../styles/switcher.css">
</head>
<body>
  <div id="app" hidden data-testid="app">
    <header class="bar" data-testid="header">
      <!-- The menu: a drawer from the left with History, Bookmarks, Archive and Settings (switcher.js openDrawer). -->
      <button id="menu-btn" class="ghost icon" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="drawer" data-i18n-title="menuBtn" data-i18n-aria="menuBtn" data-testid="menu-btn"><svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <button id="newtab" class="ghost" type="button" data-testid="newtab">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        <span data-i18n="newTab" data-testid="newtab-label">New tab</span>
      </button>
      <label class="search" data-testid="search-box">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="search" type="search" data-i18n-aria="searchAria" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="open-grid snoozed-grid closed-grid" data-testid="search">
        <span id="count" class="count" aria-live="polite" data-testid="count"></span>
      </label>
      <!-- The media player: what plays in the tabs (switcher.js renderPlayer). Hidden when nothing does. -->
      <div id="player" class="player" role="group" data-i18n-aria="mediaPlayer" hidden data-testid="player">
        <span id="player-pic" class="ppic" data-testid="player-pic"></span>
        <span class="ptext" data-testid="player-text"><span id="player-title" class="ptitle" data-testid="player-title"></span><span id="player-sub" class="psub" data-testid="player-sub"></span></span>
        <button id="player-prev" class="pbtn" type="button" data-i18n-title="mediaPrev" data-i18n-aria="mediaPrev" data-testid="player-prev"></button>
        <button id="player-toggle" class="pbtn main" type="button" data-testid="player-toggle"></button>
        <button id="player-next" class="pbtn" type="button" data-i18n-title="mediaNext" data-i18n-aria="mediaNext" data-testid="player-next"></button>
        <button id="player-more" class="pbtn more" type="button" aria-haspopup="dialog" aria-expanded="false" data-i18n-title="mediaList" data-i18n-aria="mediaList" data-testid="player-more"></button>
      </div>
      <!-- Tabazing's source on GitHub, in a new tab (switcher.js: REPO_URL). -->
      <button id="github-btn" class="ghost icon" type="button" data-i18n-title="githubTitle" data-i18n-aria="githubTitle" data-testid="github-btn"><svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></button>
      <!-- Every keyboard and mouse shortcut, in a card that opens below (switcher.js openShortcuts). -->
      <button id="keys-btn" class="ghost icon" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="keys-popover" data-i18n-title="keysTitle" data-i18n-aria="keysTitle" data-testid="keys-btn"><svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><circle cx="8" cy="8" r="6.3" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8 7.2v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="4.9" r=".95" fill="currentColor"/></svg></button>
    </header>
    <!-- The menu (☰): a drawer over the dimmed switcher, from the left. Its buttons open Tabazing's dialogs. -->
    <div id="drawer-back" class="drawerback" hidden data-testid="drawer-back">
      <nav id="drawer" class="drawer" aria-labelledby="drawer-h" data-testid="drawer">
        <div class="drawerhead" data-testid="drawer-head">
          <img class="drawerlogo" src="../icons/icon32.png" alt="" data-testid="drawer-logo">
          <h2 id="drawer-h" data-i18n="extShortName" data-testid="drawer-title">Tabazing</h2>
          <button id="drawer-close" class="setx" type="button" data-i18n-title="menuClose" data-i18n-aria="menuClose" data-testid="drawer-close"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        </div>
        <ul class="drawerlist" data-testid="drawer-list">
        <li data-testid="history-btn-item"><button id="history-btn" class="draweritem" type="button" aria-haspopup="dialog" data-i18n-title="historyBtn" data-testid="history-btn"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v2.8h2.8M8 5v3.2l2.2 1.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="dlabel" data-i18n="historyTitle" data-testid="history-btn-label"></span><kbd id="history-btn-key" data-testid="history-btn-key"></kbd></button></li>
        <li data-testid="bookmarks-btn-item"><button id="bookmarks-btn" class="draweritem" type="button" aria-haspopup="dialog" data-i18n-title="bmvBtn" data-testid="bookmarks-btn"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M4 2.5h8v11L8 10.6l-4 2.9z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg><span class="dlabel" data-i18n="bmvTitle" data-testid="bookmarks-btn-label"></span><kbd id="bookmarks-btn-key" data-testid="bookmarks-btn-key"></kbd></button></li>
        <li data-testid="archive-btn-item"><button id="archive-btn" class="draweritem" type="button" aria-haspopup="dialog" data-i18n-title="archiveBtnTitle" data-testid="archive-btn"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M1.8 3h12.4v3H1.8zM2.8 6v7h10.4V6M6.3 8.6h3.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="dlabel" data-i18n="archiveBtn" data-testid="archive-btn-label"></span><kbd id="archive-btn-key" data-testid="archive-btn-key" hidden></kbd></button></li>
        <li data-testid="backup-btn-item"><button id="backup-btn" class="draweritem" type="button" aria-haspopup="dialog" data-i18n-title="backupTitle" data-testid="backup-btn"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M4.6 12.5H4a3 3 0 0 1-.3-6 4.4 4.4 0 0 1 8.5-.8 3.3 3.3 0 0 1-.3 6.8h-.5M8 13.8V8.2M5.9 10.2 8 8.1l2.1 2.1" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="dlabel" data-i18n="backupTitle" data-testid="backup-btn-label"></span><kbd id="backup-btn-key" data-testid="backup-btn-key" hidden></kbd></button></li>
          <li class="drawersep" role="separator" data-testid="drawer-separator"></li>
        <li data-testid="settings-btn-item"><button id="settings-btn" class="draweritem" type="button" aria-haspopup="dialog" data-i18n-title="settings" data-testid="settings-btn"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8Zm5.6 3.2-.1-1.6 1.3-1-1.3-2.3-1.6.5a5 5 0 0 0-1.4-.8L10.2 2H7.6l-.3 1.6a5 5 0 0 0-1.4.8l-1.6-.5L3 6.2l1.3 1-.1 1.6-1.2 1 1.3 2.3 1.6-.5c.4.3.9.6 1.4.8l.3 1.6h2.6l.3-1.6c.5-.2 1-.5 1.4-.8l1.6.5 1.3-2.3z" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linejoin="round"/></svg><span class="dlabel" data-i18n="settings" data-testid="settings-btn-label"></span><kbd id="settings-btn-key" data-testid="settings-btn-key" hidden></kbd></button></li>
        </ul>
      </nav>
    </div>

    <div id="tools" class="tools" data-testid="tools">
      <div class="setup" data-testid="setup-actions">
        <button id="sweep-btn" class="act compact" type="button" hidden data-testid="sweep-btn">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 5.5h2.2l1.2-1.8h4.2l1.2 1.8h2.2v7h-11z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/><circle cx="8" cy="8.8" r="2" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
          <span id="sweep-text" data-testid="sweep-text"></span>
        </button>
      </div>
    </div>
    <div id="alert" class="alert" hidden data-testid="alert"><span id="alert-text" data-testid="alert-text"></span><button id="alert-btn" class="btn quiet" type="button" hidden data-testid="alert-btn"></button></div>

    <!-- Quick actions: shown while searching or once tabs are selected. -->
    <div id="acts" class="acts" role="toolbar" hidden data-testid="acts">
      <span id="acts-n" class="acts-n" data-testid="acts-n"></span>
      <button id="sel-all" class="lnk" type="button" data-testid="sel-all"></button>
      <button id="sel-none" class="lnk" type="button" data-i18n="selNone" hidden data-testid="sel-none">Clear</button>
      <span id="acts-hint" class="acts-hint" hidden data-testid="acts-hint"></span>
      <span class="grow" data-testid="acts-spacer"></span>
      <span id="acts-btns" class="acts-btns" data-testid="acts-btns"></span>
    </div>

    <div id="body" class="body" data-testid="body">
      <!-- Windows, on the left, each with a small preview of the tab it is showing. Hidden with one window. -->
      <nav id="wins" class="wins" data-i18n-aria="windowsAria" hidden data-testid="wins"></nav>
      <main id="scroller" data-testid="scroller">
        <section aria-labelledby="open-h" data-testid="open-section">
          <!-- The Open tabs title, and at the other end of its row what acts on the open tabs only: merging windows,
               closing duplicates, and how they are sorted and filtered. -->
          <div class="open-head" data-testid="open-head">
            <!-- In the group view (switcher.js renderGroupBar): "All tabs" back out, the group's colour, its name as the heading, its count. -->
            <div class="open-title" data-testid="open-title">
              <button id="group-leave" class="act grpback" type="button" hidden data-testid="group-leave"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="groupLeave" data-testid="group-leave-label">All tabs</span><kbd data-testid="group-leave-key">Esc</kbd></button>
              <span id="group-dot" class="gdot" hidden data-testid="group-dot"></span>
              <h2 id="open-h" class="section-h" data-i18n="openTabs" data-testid="open-h">Open tabs</h2>
              <span id="group-n" class="grpn" hidden data-testid="group-count"></span>
            </div>
            <div class="open-end" data-testid="open-end">
            <div class="setup open-acts" data-testid="open-actions">
            <button id="merge-btn" class="act" type="button" hidden data-testid="merge-btn">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M4.5 6.5 8 9.5l3.5-3M8 2.5v7" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span id="merge-text" data-testid="merge-text"></span>
            </button>
            <button id="dupes-btn" class="act" type="button" hidden data-testid="dupes-btn">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><rect x="6" y="6" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
              <span id="dupes-text" data-testid="dupes-text"></span>
            </button>
            </div>
            <div class="view" role="toolbar" data-i18n-aria="viewAria" data-testid="view-toolbar">
              <label class="sortbox" data-testid="sort-box"><span data-i18n="sortLabel" data-testid="sort-label">Sort</span>
                <select id="sort" data-i18n-aria="sortAria" data-testid="sort">
                  <option value="order" data-i18n="sortByOrder" data-testid="sort-order">By order</option>
                  <option value="recent" data-i18n="sortByRecent" data-testid="sort-recent">By recently used</option>
                  <option value="name" data-i18n="sortByName" data-testid="sort-name">By name</option>
                </select>
              </label>
              <button id="star-filter" class="chip" type="button" aria-pressed="false" data-testid="star-filter">
                <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="currentColor"/></svg>
                <span id="star-n" class="n" data-testid="star-n">0</span>
              </button>
              <span id="qfilters" class="qfilters" role="group" data-i18n-aria="filtersAria" data-testid="qfilters"></span>
            </div>
            </div>
          </div>
          <div id="open-grid" class="sections" role="group" aria-labelledby="open-h" data-testid="open-grid"></div>
          <p id="open-empty" class="empty" hidden data-testid="open-empty"></p>
        </section>
        <section id="snoozed-section" aria-labelledby="snoozed-h" hidden data-testid="snoozed-section">
          <h2 id="snoozed-h" class="section-h" data-i18n="snoozedH" data-testid="snoozed-h">Snoozed</h2>
          <div id="snoozed-grid" class="grid small" role="listbox" aria-labelledby="snoozed-h" data-testid="snoozed-grid"></div>
        </section>
        <section id="closed-section" aria-labelledby="closed-h" hidden data-testid="closed-section">
          <h2 id="closed-h" class="section-h" data-testid="closed-h"></h2>
          <div id="closed-grid" class="grid small" role="listbox" aria-labelledby="closed-h" data-testid="closed-grid"></div>
          <button id="closed-more" class="ghostbtn" type="button" aria-controls="closed-grid" hidden data-testid="closed-more"></button>
        </section>
      </main>

    </div>

    <div id="toast" class="toast" hidden data-testid="toast"></div>
    <!-- What screen readers announce: always there (a live region that appears with its text is often not read). -->
    <div id="live-status" class="sr-only live" role="status" aria-live="polite" data-testid="live-status"></div>
    <div id="live-alert" class="sr-only live" role="alert" data-testid="live-alert"></div>
    <!-- The command palette (switcher.js openPalette): Alt+R, '>' in the search box, or Ctrl+K. -->
    <div id="palette" class="palette" role="dialog" aria-modal="true" data-i18n-aria="palTitle" hidden data-testid="palette">
      <div class="palbar" data-testid="palette-bar">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 4.5 7.5 8 4 11.5M9 11.5h3.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="palette-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="palette-list" autocomplete="off" spellcheck="false" data-i18n-placeholder="palPlaceholder" data-i18n-aria="palInputAria" data-testid="palette-input">
      </div>
      <div id="palette-list" class="pallist" role="listbox" data-i18n-aria="palResults" data-testid="palette-list"></div>
      <div id="palette-foot" class="palfoot" data-testid="palette-foot"></div>
    </div>
    <div id="modal" class="modal-back" hidden data-testid="modal">
      <div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" data-testid="dialog"></div>
    </div>
  </div>
  <textarea id="clip" class="clip" aria-hidden="true" tabindex="-1" data-testid="clip"></textarea>
  <script type="module" src="../switcher.js"></script>
</body>
</html>
