<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tabazing</title>
  <link rel="stylesheet" href="switcher.css">
</head>
<body>
  <div id="app" hidden>
    <header class="bar">
      <button id="settings-btn" class="ghost" type="button" data-i18n-title="settings" data-i18n-aria="settings"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8Zm5.6 3.2-.1-1.6 1.3-1-1.3-2.3-1.6.5a5 5 0 0 0-1.4-.8L10.2 2H7.6l-.3 1.6a5 5 0 0 0-1.4.8l-1.6-.5L3 6.2l1.3 1-.1 1.6-1.2 1 1.3 2.3 1.6-.5c.4.3.9.6 1.4.8l.3 1.6h2.6l.3-1.6c.5-.2 1-.5 1.4-.8l1.6.5 1.3-2.3z" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linejoin="round"/></svg><span data-i18n="settings">Settings</span></button>
      <button id="newtab" class="ghost" type="button">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        <span data-i18n="newTab">New tab</span>
      </button>
      <label class="search">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchAria" autocomplete="off" spellcheck="false" aria-controls="open-grid closed-grid">
        <span id="count" class="count" aria-live="polite"></span>
      </label>
      <div class="hint" aria-hidden="true">
        <kbd>←</kbd><kbd>→</kbd> <span data-i18n="hintMove">move</span> · <kbd>Enter</kbd> <span data-i18n="hintOpen">open</span> · <kbd data-mac="⌘⌫">Del</kbd> <span data-i18n="hintClose">close tab</span> · <kbd data-mac="⌥S">Alt+S</kbd> <span data-i18n="hintStar">star</span> · <kbd>Esc</kbd> <span data-i18n="hintExit">exit</span><span id="hint-win" hidden> · <kbd data-mac="⌃←">Ctrl+←</kbd><kbd data-mac="⌃→">Ctrl+→</kbd> <span data-i18n="hintWindow">window</span></span>
      </div>
      <button id="archive-btn" class="ghost" type="button" data-i18n-title="archiveBtnTitle"><span data-i18n="archiveBtn">Archive</span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1.8 3h12.4v3H1.8zM2.8 6v7h10.4V6M6.3 8.6h3.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </header>

    <div id="tools" class="tools">
      <div class="view" role="toolbar" data-i18n-aria="viewAria">
        <label class="sortbox"><span data-i18n="sortLabel">Sort</span>
          <select id="sort" data-i18n-aria="sortAria">
            <option value="order" data-i18n="sortByOrder">By order</option>
            <option value="recent" data-i18n="sortByRecent">By recently opened</option>
            <option value="name" data-i18n="sortByName">By name</option>
          </select>
        </label>
        <button id="star-filter" class="chip" type="button" aria-pressed="false" data-i18n-title="starFilterTitle">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="currentColor"/></svg>
          <span class="label" data-i18n="starred">Starred</span><span id="star-n" class="n">0</span>
        </button>
        <span id="qfilters" class="qfilters" role="group" data-i18n-aria="filtersAria"></span>
      </div>
      <div class="setup">
        <button id="merge-btn" class="act" type="button" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M4.5 6.5 8 9.5l3.5-3M8 2.5v7" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="merge-text"></span>
        </button>
        <button id="dupes-btn" class="act" type="button" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><rect x="6" y="6" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
          <span id="dupes-text"></span>
        </button>
        <button id="sweep-btn" class="act" type="button" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 5.5h2.2l1.2-1.8h4.2l1.2 1.8h2.2v7h-11z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/><circle cx="8" cy="8.8" r="2" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
          <span id="sweep-text"></span>
        </button>
      </div>
    </div>
    <div id="alert" class="alert" role="alert" hidden><span id="alert-text"></span><button id="alert-btn" class="btn quiet" type="button" hidden></button></div>

    <!-- Quick actions: shown while searching or once tabs are selected. -->
    <div id="acts" class="acts" role="toolbar" hidden>
      <span id="acts-n" class="acts-n"></span>
      <button id="sel-all" class="lnk" type="button"></button>
      <button id="sel-none" class="lnk" type="button" data-i18n="selNone" hidden>Clear</button>
      <span class="grow"></span>
      <span id="acts-btns" class="acts-btns"></span>
    </div>

    <div id="body" class="body">
      <!-- Windows, on the left, each with a small preview of the tab it is showing. Hidden with one window. -->
      <nav id="wins" class="wins" data-i18n-aria="windowsAria" hidden></nav>
      <main id="scroller">
        <section aria-labelledby="open-h">
          <h2 id="open-h" class="section-h" data-i18n="openTabs">Open tabs</h2>
          <div id="open-grid" class="sections" role="listbox" aria-labelledby="open-h" aria-multiselectable="true"></div>
          <p id="open-empty" class="empty" hidden></p>
        </section>
        <section id="snoozed-section" aria-labelledby="snoozed-h" hidden>
          <h2 id="snoozed-h" class="section-h" data-i18n="snoozedH">Snoozed</h2>
          <div id="snoozed-grid" class="grid small" role="listbox" aria-labelledby="snoozed-h"></div>
        </section>
        <section id="closed-section" aria-labelledby="closed-h" hidden>
          <h2 id="closed-h" class="section-h"></h2>
          <div id="closed-grid" class="grid small" role="listbox" aria-labelledby="closed-h"></div>
        </section>
      </main>

    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="modal" class="modal-back" hidden>
      <div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div>
    </div>
  </div>
  <textarea id="clip" class="clip" aria-hidden="true" tabindex="-1"></textarea>
  <script type="module" src="switcher.js"></script>
</body>
</html>
